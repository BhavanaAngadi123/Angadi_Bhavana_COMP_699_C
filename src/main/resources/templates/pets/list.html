<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Pets | Happy Tails</title></head>
<body>
<main>
  <h1>My Pets</h1>
  <p><a th:href="@{/pets/new}">Add pet</a></p>
  <section th:if="${#lists.isEmpty(pets)}"><p>No pets added yet.</p></section>
  <section th:each="pet : ${pets}">
    <h2 th:text="${pet.name}">Pet name</h2>
    <p><span th:text="${pet.species}">Species</span> · <span th:text="${pet.breed}">Breed</span> · Age <span th:text="${pet.age}">0</span></p>
    <p th:if="${pet.medicalHistory}" th:text="${pet.medicalHistory}"></p>
    <form th:action="@{/pets/{id}/delete(id=${pet.id})}" method="post"><button type="submit">Delete</button></form>
  </section>
  <form th:action="@{/logout}" method="post"><button type="submit">Sign out</button></form>
</main>
</body>
</html>
