<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Happy Tails</title></head>
<body>
<main>
  <h1>Create account</h1>
  <form th:action="@{/register}" th:object="${registration}" method="post">
    <label>Name <input th:field="*{name}" required></label><div th:errors="*{name}"></div><br>
    <label>Email <input type="email" th:field="*{email}" required></label><div th:errors="*{email}"></div><br>
    <label>Password <input type="password" th:field="*{password}" required></label><div th:errors="*{password}"></div><br>
    <button type="submit">Register</button>
  </form>
  <p><a th:href="@{/login}">Already have an account?</a></p>
</main>
</body>
</html>
